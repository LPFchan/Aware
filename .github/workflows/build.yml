name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3 (PermissionFlow needs swift-tools-version 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Build Aware
        run: |
          xcodebuild -scheme Aware -configuration Debug -derivedDataPath build \
            build -quiet
